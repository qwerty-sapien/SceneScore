[project]
name = "scenescore-harness"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["jsonschema>=4.23,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.16,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "modules"]
addopts = "--import-mode=importlib"
markers = ["hardware: requires genuine headset session", "render: requires real rendered media", "live_api: requires configured model API access"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
